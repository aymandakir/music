<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="main-card">
    <div id="header-row">
      <span id="now-playing">♡ now playing</span>
      <div id="window-controls">
        <button id="minimize-btn" aria-label="Minimize">−</button>
        <button id="close-btn" aria-label="Close">×</button>
      </div>
    </div>

    <div id="album-art-wrapper">
      <div id="decor-bow" aria-hidden="true">
        <svg width="36" height="20" viewBox="0 0 36 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 10 C12 6, 2 2, 2 8 C2 14, 12 12, 18 10Z" fill="#f7c5da"/>
          <path d="M18 10 C24 6, 34 2, 34 8 C34 14, 24 12, 18 10Z" fill="#f7c5da"/>
          <circle cx="18" cy="10" r="2.5" fill="#e8699a"/>
        </svg>
      </div>
      <!-- Decorative flower left -->
      <div class="decor-flower flower-left" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="8" r="6" fill="#f7c5da" opacity="0.8"/>
          <circle cx="32" cy="16" r="6" fill="#f7c5da" opacity="0.8"/>
          <circle cx="32" cy="28" r="6" fill="#f7c5da" opacity="0.8"/>
          <circle cx="20" cy="36" r="6" fill="#f7c5da" opacity="0.8"/>
          <circle cx="8" cy="28" r="6" fill="#f7c5da" opacity="0.8"/>
          <circle cx="8" cy="16" r="6" fill="#f7c5da" opacity="0.8"/>
          <circle cx="20" cy="22" r="7" fill="#e8699a"/>
        </svg>
      </div>
      <!-- Decorative flower right -->
      <div class="decor-flower flower-right" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="8" r="5" fill="#fcd5e8" opacity="0.9"/>
          <circle cx="30" cy="15" r="5" fill="#fcd5e8" opacity="0.9"/>
          <circle cx="30" cy="27" r="5" fill="#fcd5e8" opacity="0.9"/>
          <circle cx="20" cy="34" r="5" fill="#fcd5e8" opacity="0.9"/>
          <circle cx="10" cy="27" r="5" fill="#fcd5e8" opacity="0.9"/>
          <circle cx="10" cy="15" r="5" fill="#fcd5e8" opacity="0.9"/>
          <circle cx="20" cy="21" r="5" fill="#e8699a"/>
        </svg>
      </div>
      <!-- Small sparkles -->
      <div class="sparkle sparkle-1">✦</div>
      <div class="sparkle sparkle-2">✧</div>
      <div class="sparkle sparkle-3">✦</div>
      <div id="art-glow"></div>
      <img id="song-image-img" alt="Album Art" src="" />
    </div>

    <div id="meta">
      <p id="song-title"></p>
      <p id="song-artist">IVE</p>
    </div>

    <div id="progress-container" tabindex="0">
      <div id="progress-track">
        <div id="progress-fill"></div>
        <div id="progress-thumb"></div>
      </div>
      <input type="range" id="progress-bar" min="0" max="100" value="0" aria-label="Seek" />
    </div>

    <div id="time-row">
      <span id="current-time">0:00</span>
      <span id="duration-time">0:00</span>
      <span id="time-display" style="display:none;">0:00 / 0:00</span>
    </div>

    <div id="volume-row">
      <svg id="vol-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <div id="volume-track">
        <div id="volume-fill"></div>
        <input type="range" id="volume-input" min="0" max="1" step="0.01" value="0.7">
      </div>
      <span id="vol-percent">70%</span>
    </div>

    <div id="controls">
      <button id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" width="15" height="15"><path fill="var(--accent-dark)" d="M11 6L5 12l6 6V6zm8 0v12h-2V6h2z"/></svg>
      </button>
      <button id="play-pause" aria-label="Play/Pause">▶</button>
      <button id="next" aria-label="Next">
        <svg viewBox="0 0 24 24" width="15" height="15"><path fill="var(--accent-dark)" d="M7 18l6-6-6-6v12zm8 0V6h2v12h-2z"/></svg>
      </button>
    </div>

    <div id="bottom-row">
      <button id="menu-btn">✦ Queue</button>
      <div id="heart-section">
        <div class="heart-row">
          <button class="heart-btn">♡</button>
          <button class="heart-btn">♡</button>
          <button class="heart-btn">♡</button>
        </div>
        <span class="heart-label">favorites</span>
      </div>
    </div>

    <div id="menu-overlay" role="dialog" aria-modal="true" aria-label="Queue">
      <div id="menu-header">
        <h2>✦ Queue</h2>
        <button id="menu-close-btn" aria-label="Close queue">×</button>
      </div>
      <div id="queue-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="The Marías">The Marías</button>
        <button class="filter-btn" data-filter="Mitski">Mitski</button>
        <button class="filter-btn" data-filter="The Smiths">The Smiths</button>
      </div>
      <div id="menu-list"></div>
    </div>
  </div>

  <audio id="audio-player" hidden>
    <source id="audio-source" />
  </audio>

  <script src="music-player.js"></script>
</body>
</html>
